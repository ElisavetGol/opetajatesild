<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3f6150">
  <meta name="description" content="Õpetajate Sild – alustava lasteaiaõpetaja õpiteekonna interaktiivne prototüüp">
  <title>Õpetajate Sild | Õpi, kavanda ja arene koos</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#avaleht" aria-label="Õpetajate Sild – avaleht">
        <span class="brand-symbol" aria-hidden="true">✦</span>
        <span><strong>Õpetajate Sild</strong><small>Alustava õpetaja õpiteekond</small></span>
      </a>
      <div class="nav-label">ÕPITEEKONNA NAVIGATSIOON</div>
      <nav class="nav" id="nav" aria-label="Peamenüü"></nav>
      <div class="sidebar-foot">
        <div class="identity"><span class="avatar" id="sidebar-avatar">A</span><span><strong id="sidebar-name">Arina Tamm</strong><small id="sidebar-role">Alustav lasteaiaõpetaja</small></span></div>
        <div class="demo-label">◌ Näidisprototüüp · salvestus brauseris</div>
      </div>

    <div class="content-shell">
      <header class="topbar">

      </header>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>
  <div class="toast" id="toast" aria-live="polite" role="status"></div>

</html>
